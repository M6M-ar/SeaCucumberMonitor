plugins {
    id 'com.android.application' version '7.1.2' apply false
    id 'com.android.library' version '7.1.2' apply false
}

subprojects {
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.7.0'
            force 'androidx.core:core-ktx:1.7.0'

            force 'androidx.appcompat:appcompat:1.3.0'
            force 'androidx.appcompat:appcompat-resources:1.3.0'

            force 'androidx.annotation:annotation:1.3.0'
            force 'androidx.legacy:legacy-support-v4:1.0.0'

            force 'androidx.activity:activity:1.2.4'
            force 'androidx.fragment:fragment:1.3.6'

            force 'androidx.lifecycle:lifecycle-common:2.3.1'
            force 'androidx.lifecycle:lifecycle-runtime:2.3.1'
            force 'androidx.lifecycle:lifecycle-livedata-core:2.3.1'
            force 'androidx.lifecycle:lifecycle-viewmodel:2.3.1'
            force 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.3.1'

            force 'androidx.savedstate:savedstate:1.1.0'

            force 'org.jetbrains.kotlin:kotlin-stdlib:1.5.31'
            force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.5.31'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.5.31'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.5.31'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}