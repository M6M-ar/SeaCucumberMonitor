<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>删除信息</title>
    <meta name="keywords" content="">
    <meta name="description" content="">

    <link rel="shortcut icon" href="favicon.ico"> <link href="../static/css/bootstrap.min.css?v=3.3.6" rel="stylesheet">
    <link href="../static/css/font-awesome.css?v=4.4.0" rel="stylesheet">

    <link href="../static/css/animate.css" rel="stylesheet">
    <link href="../static/css/style.css?v=4.1.0" rel="stylesheet">

</head>

<body class="gray-bg">

<div class="wrapper wrapper-content animated fadeInUp">
    <div class="row">
        <div class="col-sm-5">

            <div class="ibox">
                <div class="ibox-title">
                    <h5>删除信息</h5>

                </div>

                <div class="ibox-content">
                    <div class="form-horizontal m-t" id="commentForm" novalidate="novalidate">
                        <div class="form-group">
                            <button class="btn btn-primary delete_text" type="submit">清空所有日志</button>
                            <button class="btn btn-primary delete_history" type="submit">清空所有历史轨迹</button>
                            <button class="btn btn-primary delete_all" type="submit">清除数据库</button>
                        </div>

                    </div>

                </div>


            </div>
        </div>
    </div>
</div>
</div>

<!-- 全局js -->
<script src="../static/js/jquery.min.js?v=2.1.4"></script>
<script src="../static/js/bootstrap.min.js?v=3.3.6"></script>
<script src="../static/js/plugins/layer/laydate/laydate.js"></script>

<!-- 自定义js -->
<script src="../static/js/content.js?v=1.0.0"></script>
<script>



    $(".delete_text").click(function() {
        $.ajax({
            type:'post',
            url:"/postDelRecord",
            data:{},
            dataType:'json',
            success:function(data){ //请求成功回调函数

            },
        });
    })

    $(".delete_history").click(function() {
        $.ajax({
            type:'post',
            url:"/postDelSite",
            data:{},
            dataType:'json',
            success:function(data){ //请求成功回调函数

            },
        });
    })
    
       $(".delete_all").click(function() {
        $.ajax({
            type:'post',
            url:"/postDelAll",
            data:{},
            dataType:'json',
            success:function(data){ //请求成功回调函数

            },
        });
    })

</script>


</body>
</html>
