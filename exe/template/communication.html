    <script>
        //日期范围限制
        var start = {
            elem: '#start',
            format: 'YYYY/MM/DD hh:mm:ss',
            min: laydate.now(), //设定最小日期为当前日期
            max: '2099-06-16 23:59:59', //最大日期
            istime: true,
            istoday: false,
            choose: function (datas) {
                end.min = datas; //开始日选好后，重置结束日的最小日期
                end.start = datas //将结束日的初始值设定为开始日
            }
        };
        var end = {
            elem: '#end',
            format: 'YYYY/MM/DD hh:mm:ss',
            min: laydate.now(),
            max: '2099-06-16 23:59:59',
            istime: true,
            istoday: false,
            choose: function (datas) {
                start.max = datas; //结束日选好后，重置开始日的最大日期
            }
        };
        laydate(start);
        laydate(end);

        var bug=null;
        
        var q=''
        var i
        $(function () {
            message()
            load()
        })

        $(document).on('click','#content',function () {
            if($("input[name='content']:checked").val()=='ranging'){
                $('#ascii_content').attr("disabled",true);
                $('#hex_content').attr("disabled",true);
            }else if($("input[name='content']:checked").val()=='ascii'){
                $('#ascii_content').removeAttr("disabled");
                $('#hex_content').attr("disabled",true);
            }else {
                $('#ascii_content').attr("disabled",true);
                $('#hex_content').removeAttr("disabled");
            }
        })

        $('.send').click(function () {
            var target_id = $('#target_id').val()
            var pattern = $('#pattern').val()
            var flag = ''
            var content = ''
            var hex_content
            if($("input[name='content']:checked").val()=='ranging'){
                flag = $("input[name='content']:checked").val()
            }else if($("input[name='content']:checked").val()=='ascii'){
                flag = $("input[name='content']:checked").val()
                content =$('#ascii_content').val()
                hex_content =$('#hex_content').val()
            }else {
                flag = $("input[name='content']:checked").val()
                hex_content =$('#hex_content').val()
                content =$('#ascii_content').val()
            }

            //发送
            $.ajax({
                type:'post',
                url:"/cmctnSent",
                data:{'Dstid':target_id,'SentModel':pattern,'ChosType':flag,'SentMsgAsc':content,'SentMsgHex':hex_content},
                dataType:'json',
                success:function(data){ //请求成功回调函数
                    if(data.data[0].Ptf){
                      q='<div class="form-group row">'+data.data[0].Ptf+'</div>';
                      $(".textarea").append(q);
                    }
                    
                },
            });

        })

        //消息回显
        function message() {
        //  var interval = setInterval(function() {
                 $.ajax({
                     type:'post',
                     url:"/cmctnRecord",
                     data:{},
                     dataType:'json',
                     success:function(data){ //请求成功回调函数
                    console.log(data)
                    var w=''
                        if(data.data[0].msg==''){
                          
                        }else{
                        for(i=0;i<data.data.length;i++){
                          w+='<div class="form-group row">'+data.data[i].msg+'</div>';
                    
                        }
                           console.log(w)
                          $(".textarea").append(w);
                          var lenght = $("div", ".textarea").length
                          if(lenght>100){
                            $(".textarea div:first-child").remove()
                          }
                        }
                      setTimeout(message, 2000)
                  
                     },
                 });
            
             
           // }, 8000)

        }
        
        function load(){
                $.ajax({
                     type:'post',
                     url:"/cmctnCfg",
                     data:{},
                     dataType:'json',
                     success:function(data){ //请求成功回调函数
                 
                       if(data.data[0].Dstid){
                        $('#target_id').val(data.data[0].Dstid)
                      }
                      if(data.data[0].SentModel){
                        $('#pattern').val(data.data[0].SentModel)
                      }
                      if(data.data[0].ChosType=='ranging'){
                        $("input[name='content'][value='ranging']").attr("checked",true)
                          $('#ascii_content').attr("disabled",true);
                          $('#hex_content').attr("disabled",true);
                      }else if(data.data[0].ChosType=='ascii'){
                        $("input[name='content'][value='ascii']").attr("checked",true)  
                        $('#ascii_content').val(data.data[0].SentMsgAsc)
                        $('#hex_content').val(data.data[0].SentMsgHex)
                          $('#ascii_content').removeAttr("disabled");
                          $('#hex_content').attr("disabled",true);
                      }else{
                        $("input[name='content'][value='hex']").attr("checked",true) 
                        $('#hex_content').val(data.data[0].SentMsgHex)
                        $('#ascii_content').val(data.data[0].SentMsgAsc)
                          $('#ascii_content').attr("disabled",true);
                          $('#hex_content').removeAttr("disabled");
                      }
                      
                     },
                 });
                
            $.ajax({
                     type:'post',
                     url:"/getIfOpenCmctn",
                     data:{},
                     dataType:'json',
                     success:function(data){ //请求成功回调函数
                        if(data.data[0].OpenRang=="0"){
                          $(".ranging").attr("disabled", true);
                        }
                        if(data.data[0].OpenMsgAsc=="0"){
                          $(".ascii").attr("disabled", true);
                          $("#ascii_content").attr("disabled", true);
                        }
                        if(data.data[0].OpenMsgHex=="0"){
                          $(".hex").attr("disabled", true);
                          $("#hex_content").attr("disabled", true);
                        }
                      
                     },
                 });         
                
        }

        function timestampToTime(timestamp) {
            var date = new Date(timestamp * 1000);//时间戳为10位需*1000，时间戳为13位的话不需乘1000
            var Y = date.getFullYear() + '-';
            var M = (date.getMonth()+1 < 10 ? '0'+(date.getMonth()+1) : date.getMonth()+1) + '-';
            var D = date.getDate() + ' ';
            var h = date.getHours() + ':';
            var m = date.getMinutes() + ':';
            var s = date.getSeconds();
            return Y+M+D+h+m+s;
        }
