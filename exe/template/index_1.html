    function toogle(th){
        var ele = $(th).children(".move");

        if(ele.attr("data-state") == "on"){
            ele.animate({left: "0"}, 200, function(){
                ele.attr("data-state", "off");
            });
            $(th).removeClass("on").addClass("off");

        }else if(ele.attr("data-state") == "off"){
            ele.animate({left: '20px'}, 200, function(){
                $(this).attr("data-state", "on");

            });
            $(th).removeClass("off").addClass("on");

    function getLangDate() {
        var dateObj = new Date(); //表示当前系统时间的Date对象
        var year = dateObj.getFullYear(); //当前系统时间的完整年份值
        var month = dateObj.getMonth() + 1; //当前系统时间的月份值
        var date = dateObj.getDate(); //当前系统时间的月份中的日
        var hour = dateObj.getHours(); //当前系统时间的小时值
        var minute = dateObj.getMinutes(); //当前系统时间的分钟值
        var second = dateObj.getSeconds(); //当前系统时间的秒钟值
        //如果月、日、小时、分、秒的值小于10，在前面补0
        if (month < 10) {
            month = "0" + month;
        }
        if (date < 10) {
            date = "0" + date;
        }
        if (hour < 10) {
            hour = "0" + hour;
        }
        if (minute < 10) {
            minute = "0" + minute;
        }
        if (second < 10) {
            second = "0" + second;
        }

        var newDate = year + month  + date  + hour + minute  + second;
        return newDate;

    }

        }

        for(var i=0;i<data.Target.length;i++){
            var item=data.Target[i];
            var index=nameList.indexOf(item.TargetName);
            if(index>-1){
                options.series[index].data=options.series[index].data.concat(item.Deep);
                if(options.series[index].data.length>100){
                    options.series[index].data.splice(0,options.series[index].data.length-100);

            }else {
                options.series.push(
                    {
                        id:item.MdmId,
                        name:item.TargetName,
                        type:'line',
                        smooth:true,
                        symbolSize:10,
                        data:item.Deep,

                                    }
                            },
                    }
                );
            }
            arr.push(''+item.TargetName+'')
        }

        options.legend.data=arr
        shendu.setOption(options,true);
