<script>
    var dom = document.getElementById("container");
    var myChart;
    option = null;
    var zr;
    var synOrAsyn=''
    var close_ds
    var picture_type=''
    var echartscount=0

    $(function () {selected_xinbiao()
        $("[data-toggle='tooltip']").tooltip();
        myChart = echarts.init(dom);
        myChart.setOption(option);
        window.addEventListener("resize", function () {
            myChart.resize();
        });
        zr = myChart.getZr();
        document.oncontextmenu = function () { return false; };
        //新加上鼠标右击事件
        zr.on('contextmenu', function (params) {
            w=0
            i=0
            q=0
            line_area=0
            line_mao=''
            zr.off('click')
            zr.remove(traceEl);
            $('.range').hide()
            $('.ruler').removeClass('ruler_focus')
            $('.location').removeClass('location_focus')
            $('.anchor_area').removeClass('anchor_foucs')
            ruler_flag=false
            point_flag=false
        });
        load_1()
        myChart.on('dblclick', function (params) {         
            if(params.value.length==2){
                var name=params.seriesName
                var lng=params.value[0]
                var lat=params.value[1]
                var dataIndex=params.dataIndex
                $('.longitude').val(lng)
                $('.latitude').val(lat)
                $('.line_mao_name').text(name)
                layer.open({
                    title: ['区域点', 'font-size:18px;font-weight: 500;'],
                    type: 1,
                    area:  ['500px','350px'],
                    content: $('#mao_line_pop')
                    ,btn: [ '确定修改','删除名称为'+name+'的标记点'],
                    yes: function(index, layero){
                        var lng=$('.longitude').val()
                        var lat=$('.latitude').val()
                        let xIndexstart = myChart.getOption().dataZoom[0].startValue;
                        let xIndexend = myChart.getOption().dataZoom[0].endValue;
                        let yIndexstart = myChart.getOption().dataZoom[1].startValue;
                        let yIndexend = myChart.getOption().dataZoom[1].endValue;
                        var fixed_arr=myChart.getOption().series
                        $.ajax({
                            type:'post',
                            url:"/postSmallNewFixed",
                            data:{'Name':name,'OnlyId':name,'Opt':'modify','JinDu':lng,'WeiDu':lat,'Genre':'1','IndexNum':dataIndex},
                            dataType:'json',
                            success:function(data){ //请求成功回调函数
                
                            },
                        });
                        for(var i=0;i<fixed_arr.length;i++){
                            if(fixed_arr[i].name==name){
                                option.series[i].data[dataIndex]=[Number(lng),Number(lat)]
                            }
                        }
                        option.dataZoom= [{
                            type: 'inside',
                            xAxisIndex: 0,//控制x轴
                            startValue: xIndexstart,
                            endValue: xIndexend,
                            filterMode: 'none',
                        },
                            {
                                type: 'inside',
                                yAxisIndex: 0,//控制y轴
                                startValue: yIndexstart,
                                endValue: yIndexend,
                                filterMode: 'none',
                            }
                        ]                       
                        myChart.setOption(option,true)
                        layer.close(index);
                    }
                    ,btn2: function(index, layero){
                        let xIndexstart = myChart.getOption().dataZoom[0].startValue;
                        let xIndexend = myChart.getOption().dataZoom[0].endValue;
                        let yIndexstart = myChart.getOption().dataZoom[1].startValue;
                        let yIndexend = myChart.getOption().dataZoom[1].endValue;
                        var fixed_arr=myChart.getOption().series
                         $.ajax({
                            type:'post',
                            url:"/postSmallNewFixed",
                            data:{'Name':name,'OnlyId':name,'Opt':'delete','JinDu':lng,'WeiDu':lat,'Genre':'1'},
                            dataType:'json',
                            success:function(data){ //请求成功回调函数
                
                            },
                        });
                        for(var i=0;i<fixed_arr.length;i++){
                            if(fixed_arr[i].name==name){
                                option.series.splice(i,1)
                            }
                        }
                        option.dataZoom= [{
                            type: 'inside',
                            xAxisIndex: 0,//控制x轴
                            startValue: xIndexstart,
                            endValue: xIndexend,
                            filterMode: 'none',
                        },
                            {
                                type: 'inside',
                                yAxisIndex: 0,//控制y轴
                                startValue: yIndexstart,
                                endValue: yIndexend,
                                filterMode: 'none',
                            }
                        ]
                        console.log(option)
                        myChart.setOption(option,true)

                    }
                });
            }

        });
    })

    option = {
        tooltip: {
            hideDelay: 3000,
            trigger: 'item',
            formatter: function (params) {
                if(params.data.length==14){
                  var point_num=params.data[13]
                    if(point_num.substr(point_num.length-1,1)=='1'){
                      if(point_num.substr(point_num.length-3,1)=='1'){
                        return 'id:'+params.seriesId+'<br/>名称:'+params.seriesName+'<br/>经纬度:(' + params.data[0] + ',' + params.data[1]+ ')<br>时间: ' + params.data[4]+'<br/>速度:'+Number(params.data[6]).toFixed(1)+'<br/>朝向:'+Number(params.data[7]).toFixed(1);
                      }else{
                        return 'id:'+params.seriesId+'<br/>名称:'+params.seriesName+'<br/>经纬度:(' + params.data[0] + ',' + params.data[1]+ ')<br>时间: ' + params.data[4]+'<br/>速度:'+Number(params.data[6]).toFixed(1)+'<br/>朝向:无效';
                      }
                    }else{
                      return 'id:'+params.seriesId+'<br/>名称:'+params.seriesName+'<br/>经纬度:(' + params.data[0] + ',' + params.data[1]+ ')<br>时间: ' + params.data[4]+'<br/>坐标(北东深/m):'+params.data[8].toFixed(2)+ ',' +params.data[9].toFixed(2)+ ',' +params.data[10];
                    }
                    
                  if(params.data[13]=='000001'){
                    return 'id:'+params.seriesId+'<br/>名称:'+params.seriesName+'<br/>经纬度:(' + params.data[0] + ',' + params.data[1]+ ')<br>时间: ' + params.data[4]+'<br/>速度:'+Number(params.data[6]).toFixed(1);
                  }else{
                    return 'id:'+params.seriesId+'<br/>名称:'+params.seriesName+'<br/>经纬度:(' + params.data[0] + ',' + params.data[1]+ ')<br>时间: ' + params.data[4]+'<br/>坐标(北东深/m):'+params.data[8].toFixed(2)+ ',' +params.data[9].toFixed(2)+ ',' +params.data[10];
                  }

        type: 'arrow',

        shape: {
            x: 0,
            y: 0,
            width: 0,
            height: 0
        },

        buildPath: function (ctx, shape) {
            var height = shape.height;
            var width = shape.width;
            var x = shape.x;
            var y = shape.y;
            var dx = width / 3 * 2;
            ctx.moveTo(x, y);
            ctx.lineTo(x + dx, y + height);
            ctx.lineTo(x, y + height / 4 * 3);
            ctx.lineTo(x - dx, y + height);
            ctx.lineTo(x, y);
            ctx.closePath();
        }
    });

    function change_distinguish_all(str){
        var str =str.replace(/\，/g,"\,")
        var res=str.split(',')     
        var lat=''
        var lng=''
        if(res.length ==4){
            var gpslat = parseFloat(res[0]);
            var gpslng = parseFloat(res[2]);
            var resultlat = parseInt(gpslng/100) + (gpslng/100.0 - parseInt(gpslng/100)) *100.0 / 60.0;
            var resultlng = parseInt(gpslat/100) + (gpslat/100.0 - parseInt(gpslat/100)) *100.0 / 60.0;
            if(res[1].toUpperCase()=='N'){
                lat=resultlat.toFixed(6)
            }else if(res[3].toUpperCase()=='S') {
                lat=-resultlat.toFixed(6)
            }else {
                layer_tc('提示', '请检查字母是否正确，纬度半球N（北半球）或S（南半球）')
            }
            if(res[3].toUpperCase()=='E'){
                lng=resultlng.toFixed(6)
            }else if(res[3].toUpperCase()=='W'){
                lng=-resultlng.toFixed(6)
            }else {
                layer_tc('提示','请检查字母是否正确，经度半球E（东经）或W（西经）')
            }
            $('.longitude').val(lat)
            $('.latitude').val(lng)
          
        }else {
            layer_tc('提示', '请输入正确的格式,确保逗号是英文输入下的逗号,如：2813.9908005,N,11252.6285300,E')
        }
    }
