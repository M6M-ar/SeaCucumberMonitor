<script>
    var clock=''
    var confirm_time =''
    var mdmid=''
    var mdmpower=''
    var base=''
    var base_time=''
  
    $(document).on('click','#serial_port',function () {
     if($("input[name='serial_port']:checked").val()=='uart'){
          $('#com').removeAttr("disabled");
           $('#baud').removeAttr("disabled");
          $('#ip').attr("disabled",true);
           $('#port_number').attr("disabled",true);
        }else {
           $('#ip').removeAttr("disabled");
           $('#port_number').removeAttr("disabled");
          $('#com').attr("disabled",true);
           $('#baud').attr("disabled",true);
        }
    })
    
    $('.connect1').click(function () {
        $(".connect1").hide();
        $(".jk").append(
            '<div class="sk-spinner sk-spinner-fading-circle load">'+
            '<div class="sk-circle1 sk-circle"></div>'+
             '<div class="sk-circle2 sk-circle"></div>'+
             '<div class="sk-circle3 sk-circle"></div>'+
              '<div class="sk-circle4 sk-circle"></div>'+
             '<div class="sk-circle5 sk-circle"></div>'+
             '<div class="sk-circle6 sk-circle"></div>'+
              '<div class="sk-circle7 sk-circle"></div>'+
              '<div class="sk-circle8 sk-circle"></div>'+
              '<div class="sk-circle9 sk-circle"></div>'+
              '<div class="sk-circle10 sk-circle"></div>'+
              '<div class="sk-circle11 sk-circle"></div>'+
              '<div class="sk-circle12 sk-circle"></div>'+
              '</div>'
    )
        var xy = $('#xy').val()
        if($("input[name='serial_port']:checked").val()=='uart'){
            var interface='uart'
            var  com = $('#com').val()
            var  baud = $('#baud').val()
            var data ={'DevPtl':xy,'DevType':interface,'DevName':com,'Btl':baud}
        }else {
            var interface='net'
            var  ip = $('#ip').val()
            var  port_number = $('#port_number').val()
            var data ={'DevPtl':xy,'DevType':interface,'Ip':ip,'Port':port_number}
        }
        /**状态标签,ajax 请求以后的状态
        $(".load").hide();
        $(".jk").append(
        '<span class="label label-success status">已连接</span>'
        )
        $(".jk").append(
            '<span class="label label-danger status">连接错误</span>'
        )
        **/
        //水声通信/定位设备
        $.ajax({
            type:'post',
            url:"/postSetUartOrNet",
            data:data,
            dataType:'json',
            success:function(data){ //请求成功回调函数
                console.log(data.data[0])
                if(data.data[0].IsOk==1){
                  $(".load").hide();
                  $(".jk").append(
                  '<span class="label label-success status">已连接</span>'
                  )
                    $(".jk").append(
                        '<button class="btn btn-primary close1" type="submit">关闭</button>'
                    )
                }else{
                  $(".load").hide();
                  $(".jk").append(
                  '<span class="label label-danger status">连接错误</span>'
                  )
                  setTimeout(function(){
                    $(".status").hide();
                    $(".connect1").show();
                  },3000);
                  
                }

            },
        });
    })

    $(document).on('click','.close1',function () {
      var xy = $('#xy').val()
        if($("input[name='serial_port']:checked").val()=='uart'){
            var interface='uart'
            var  com = $('#com').val()
            var  baud = $('#baud').val()
            var data ={'DevPtl':xy,'DevType':interface,'DevName':com,'Btl':baud}
        }else {
            var interface='net'
            var  ip = $('#ip').val()
            var  port_number = $('#port_number').val()
            var data ={'DevPtl':xy,'DevType':interface,'Ip':ip,'Port':port_number}
        }
        $.ajax({
            type:'post',
            url:"/postCloseUartOrNet",
            data:data,
            dataType:'json',
            success:function(data){ //请求成功回调函数
                console.log(data)
                if(data.data[0].IsOk==0){
                  $('.close1').hide()
                  $('.status').hide()
                  $('.connect1').show()
                }
            },
        });
    })

    $('.connect2').click(function () {
        $(".connect2").hide();
        $(".gps_jk").append(
            '<div class="sk-spinner sk-spinner-fading-circle load">'+
            '<div class="sk-circle1 sk-circle"></div>'+
            '<div class="sk-circle2 sk-circle"></div>'+
            '<div class="sk-circle3 sk-circle"></div>'+
            '<div class="sk-circle4 sk-circle"></div>'+
            '<div class="sk-circle5 sk-circle"></div>'+
            '<div class="sk-circle6 sk-circle"></div>'+
            '<div class="sk-circle7 sk-circle"></div>'+
            '<div class="sk-circle8 sk-circle"></div>'+
            '<div class="sk-circle9 sk-circle"></div>'+
            '<div class="sk-circle10 sk-circle"></div>'+
            '<div class="sk-circle11 sk-circle"></div>'+
            '<div class="sk-circle12 sk-circle"></div>'+
            '</div>'
        )
            var datastate = $('.gps_move').attr("data-state")
            var com = $('#gps_com').val()
            var baud = $('#gps_baud').val()
            var data ={'DevName':com,'Btl':baud}
       
        /**状态标签,ajax 请求以后的状态
         $(".load").hide();
         $(".gps_jk").append(
         '<span class="label label-success status">已连接</span>'
         )
         $(".gps_jk").append(
         '<span class="label label-danger status">连接错误</span>'
         )
         **/
        //启用外接GPS设备
        $.ajax({
            type:'post',
            url:"/postSetGps",
            data:data,
            dataType:'json',
            success:function(data){ //请求成功回调函数
              if(data.data[0].IfOpen=="1"){
              $(".load").hide();
               $(".gps_jk").append(
               '<span class="label label-success status gpsstatus">已连接</span>'
               )
              }else{
                $(".load").hide();
                 $(".gps_jk").append(
                 '<span class="label label-danger status gpsstatus">连接错误</span>'
                 )
              }



            },
        });
    })

    $('.connect3').click(function () {
        $(".connect3").hide();
        $(".imu_jk").append(
            '<div class="sk-spinner sk-spinner-fading-circle load">'+
            '<div class="sk-circle1 sk-circle"></div>'+
            '<div class="sk-circle2 sk-circle"></div>'+
            '<div class="sk-circle3 sk-circle"></div>'+
            '<div class="sk-circle4 sk-circle"></div>'+
            '<div class="sk-circle5 sk-circle"></div>'+
            '<div class="sk-circle6 sk-circle"></div>'+
            '<div class="sk-circle7 sk-circle"></div>'+
            '<div class="sk-circle8 sk-circle"></div>'+
            '<div class="sk-circle9 sk-circle"></div>'+
            '<div class="sk-circle10 sk-circle"></div>'+
            '<div class="sk-circle11 sk-circle"></div>'+
            '<div class="sk-circle12 sk-circle"></div>'+
            '</div>'
        )
        if($("input[name='imu_serial_port']:checked").val()=='option1'){
            var interface='option1'
            var  com = $('#imu_com').val()
            var  baud = $('#imu_baud').val()
            var data ={'interface':interface,'com':com,'baud':baud}
        }else {
            var interface='option2'
            var  ip = $('#imu_ip').val()
            var  port_number = $('#imu_port_number').val()
            var data ={'interface':interface,'ip':ip,'port_number':port_number}
        }
        /**状态标签,ajax 请求以后的状态
         $(".load").hide();
         $(".gps_jk").append(
         '<span class="label label-success status">已连接</span>'
         )
         $(".gps_jk").append(
         '<span class="label label-danger status">连接错误</span>'
         )
         **/
        //启用外接船载IMU
        $.ajax({
            type:'post',
            url:"",
            data:data,
            dataType:'json',
            success:function(data){ //请求成功回调函数




            },
        });
    })

    $('.bj_id').click(function () {
        $('#id').removeAttr("disabled");
        $('.bj_id').hide();
        $(".bj_id").before(
            '<a class="hook sethook_id"><i class="fa fa-check"></i></a><a class="cross setcross_id"><i class="fa fa-close"></i></a>'
        )
    })

    //本机ID
    $(document).on('click','.sethook_id',function(){
        var id =$('#id').val()
        var power =''
        $.ajax({
            type:'post',
            url:"/postSetMdmID",
            data:{'MyId':id,'SentPower':power},
            dataType:'json',
            success:function(data){ //请求成功回调函数
                $('.bj_id').show();
                $('.sethook_id').remove();
                $('.setcross_id').remove();
                $('#id').attr("disabled","disabled");
                if(data.data[0].IsOk=="2"){
                  SetMdmID()
                }else{
                   $('.bj_msg').text(data.data[0].Ptf)
                }
                

            },
        });
    })
      
    function SetMdmID(){  
          $.ajax({
            type:'post',
            url:"/postAnswerSetMdmID",
            data:{},
            dataType:'json',
            success:function(data){ //请求成功回调函数
              if(data.data[0].IsOk=="2"){
                $('.bj_sx').attr("disabled","disabled");
                 mdmid = setTimeout(SetMdmID, 2000); 
                
              }else{
                clearInterval(mdmid);
                $('.bj_sx').removeAttr("disabled");
                 $('.bj_msg').text(data.data[0].Ptf)
                $('#id').val(data.data[0].MyId)
              }
              
            },
        });
    }


    $(document).on('click','.setcross_id',function(){
        $('.bj_id').show();
        $('.sethook_id').hide();
        $('.setcross_id').hide();
        $('#id').attr("disabled","disabled");
    })

    $('.confirm').click(function () {
        $('#power').removeAttr("disabled");
        $('.confirm').hide();
        $(".confirm").before(
            '<a class="hook sethook_power"><i class="fa fa-check"></i></a><a class="cross setcross_power"><i class="fa fa-close"></i></a>'
        )
    })
    
    $('.bj_sx').click(function(){
           $.ajax({
            type:'post',
            url:"/postGetMdmID",
            data:{},
            dataType:'json',
            success:function(data){ //请求成功回调函数
                 if(data.data[0].IsOk=="2"){
                    bj_settime()
                }else{
                   $('.bj_msg').text(data.data[0].Ptf)
                }
               
            },
        });
    
    })
    
    function bj_settime(){  
          $.ajax({
            type:'post',
            url:"/postAnswerGetMdmID",
            data:{},
            dataType:'json',
            success:function(data){ //请求成功回调函数
              if(data.data[0].IsOk=="2"){
                $('.bj_sx').attr("disabled","disabled");
                 clock = setTimeout(bj_settime, 2000); 
                
              }else if(data.data[0].IsOk=="4"){
                  clearInterval(clock);
              }else{
                clearInterval(clock);
                $('.bj_sx').removeAttr("disabled");
                 $('.bj_msg').text(data.data[0].Ptf)
                $('#id').val(data.data[0].MyId)
              }
              
            },
        });
    }

    //发送功率
    $(document).on('click','.sethook_power',function(){
        var power =$('#power').val()
        var id =''
        $.ajax({
            type:'post',
            url:"/postSetMdmPower",
