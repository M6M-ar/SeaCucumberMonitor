<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>接口配置</title>
    <meta name="keywords" content="">
    <meta name="description" content="">

    <link href="../static/css/bootstrap.min.css?v=3.3.6" rel="stylesheet">
    <link href="../static/css/font-awesome.css?v=4.4.0" rel="stylesheet">

    <link href="../static/css/animate.css" rel="stylesheet">
    <link href="../static/css/style.css?v=4.1.0" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">


</head>

<body class="gray-bg">

    <div class="wrapper wrapper-content animated fadeInUp">
        <div class="row">
            <div class="col-sm-10 two">

                <div class="ibox">
                    <div class="ibox-title">
                        <h5>调试信息</h5>
                    </div>
                    <div class="ibox-content">
                            <div class="feed-activity-list">
                                <div class="feed-element">
                                    <div class="media-body ">
                                        <small class="pull-right dw">0<span>m</span></small>
                                        <label class="col-sm-8 control-label">定位标准差</label>
                                        <label class="col-sm-8 control-label fontcolor">当前定位计算的标准差
                                        </label>
                                    </div>
                                </div>
                                <div class="feed-element">
                                    <div class="media-body ">
                                        <small class="pull-right db">0<span>dB</span></small>
                                        <label class="col-sm-8 control-label">水声信号质量（信噪比）</label>
                                    </div>
                                </div>
                                <div class="feed-element">
                                    <div class="media-body ">
                                        <label class="col-sm-8 control-label">外接GPS信号质量</label>
                                        <label class="col-sm-8 control-label">卫星数</label>
                                        <small class="pull-right wx">0</small>
                                        <label class="col-sm-8 control-label">水平精度系数（HDOP）</label>
                                        <small class="pull-right jd">0</small>
                                    </div>
                                </div>
                                <div class="feed-element">
                                    <div class="media-body ">
                                        <label class="col-sm-8 control-label">内置IMU原始读数详情</label>
                                        <label class="col-sm-8 control-label">Roll</label>
                                        <small class="pull-right roll">0°</small>
                                        <label class="col-sm-8 control-label">Pitch</label>
                                        <small class="pull-right pitch">0°</small>
                                        <label class="col-sm-8 control-label">Yaw</label>
                                        <small class="pull-right taw">0°</small>
                                    </div>
                                </div>
                                         <div class="feed-element">
                                    <div class="media-body ">
                                        <label class="col-sm-8 control-label">软件版本</label>
                          
                                        <small class="pull-right rj">12</small>
                                       
                                    </div>
                                </div>

                            </div>


                    </div>
                </div>

            </div>
            </div>
            </div>
        </div>

    <!-- 全局js -->
    <script src="../static/js/jquery.min.js?v=2.1.4"></script>
    <script src="../static/js/bootstrap.min.js?v=3.3.6"></script>
    <script>

        $(function () {
            message()
        })

        //信息回显
        function message() {
            bug = setInterval(function() {
                $.ajax({
                    type:'post',
                    url:"/getDebug",
                    data:{},
                    dataType:'json',
                    success:function(data){ //请求成功回调函数
                        if(data){
                          $('.dw').text(data.data[0].SitDeviation+'m')
                          $('.db').text(data.data[0].SignalNoiseRatio+'dB')
                          $('.wx').text(data.data[0].SatelliteNum)
                          $('.jd').text(data.data[0].Hdop)
                          $('.roll').text(data.data[0].ImuRoll+'°')
                          $('.pitch').text(data.data[0].ImuPitch+'°')
                          $('.taw').text(data.data[0].ImuYaw+'°')
                          $('.rj').text(data.data[0].SoftVer)
                    
                        }
                    },
                });
            },2000)

        }
    </script>



    </body>
</html>
